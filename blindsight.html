<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blindsight Guessing Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.5;
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .subtitle { color: #555; margin-bottom: 20px; }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    .round-counter {
      font-weight: bold;
      margin-bottom: 10px;
      color: #555;
    }

    .cards {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin: 20px 0;
    }

    .card {
      width: 140px;
      height: 160px;
      border: 3px solid #333;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      cursor: pointer;
      background: #f5f5f5;
      user-select: none;
    }

    .card:hover { background: #eee; }
    .card.disabled { cursor: default; }
    .card.burning { background: #fde3e3; border-color: #b00020; }
    .card.safe { background: #e3f7e6; border-color: #187a2f; }

    .feedback {
      font-size: 20px;
      font-weight: bold;
      margin: 16px 0;
      min-height: 28px;
    }
    .feedback.correct { color: #187a2f; }
    .feedback.incorrect { color: #b00020; }

    button {
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .summary {
      font-size: 20px;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <div id="screen-name">
    <h1>Blindsight Guessing Game</h1>
    <p class="subtitle">
      You'll see two houses, side by side. One is on fire &mdash; try to pick the one that
      is <strong>not</strong> on fire. You'll do this 17 times.
    </p>
    <input id="nameInput" type="text" placeholder="Your name">
    <button onclick="startGame()">Start</button>
  </div>

  <div id="screen-game" style="display:none;">
    <div class="round-counter" id="roundCounter"></div>
    <p>Which house is <strong>not</strong> on fire?</p>
    <div class="cards">
      <div class="card" id="cardLeft" onclick="guess('left')"></div>
      <div class="card" id="cardRight" onclick="guess('right')"></div>
    </div>
    <div class="feedback" id="feedback"></div>
    <button id="nextButton" style="display:none;" onclick="nextRound()">Next round</button>
  </div>

  <div id="screen-summary" style="display:none;">
    <h1>All done!</h1>
    <p class="summary" id="summaryText"></p>
    <p id="submitStatus">Submitting your results...</p>
    <p id="fallbackLink" style="font-size:14px; color:#555;"></p>
  </div>

  <script>
    // ---- Config: fill these in ----
    const TOTAL_ROUNDS = 17;

    // From your Google Form: click the three dots -> "Get pre-filled link",
    // fill in dummy values, and copy the resulting URL. Pull the form ID and
    // entry IDs out of that URL and paste them in below. Note this uses the
    // formResponse endpoint (not viewform) for direct submission.
    const FORM_ID = "YOUR_FORM_ID";
    const FORM_SUBMIT_URL = `https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`;
    const NAME_ENTRY_ID = "entry.111111111";   // replace with your Name field's entry ID
    const SCORE_ENTRY_ID = "entry.222222222";  // replace with your Score field's entry ID

    // ---- Game state ----
    let studentName = "";
    let round = 0;
    let score = 0;
    let correctSide = null;
    let answered = false;

    function startGame() {
      const input = document.getElementById("nameInput");
      studentName = input.value.trim();

      if (!studentName) {
        input.focus();
        return;
      }

      document.getElementById("screen-name").style.display = "none";
      document.getElementById("screen-game").style.display = "block";
      round = 0;
      score = 0;
      nextRound();
    }

    function nextRound() {
      if (round >= TOTAL_ROUNDS) {
        showSummary();
        return;
      }

      round++;
      answered = false;
      correctSide = Math.random() < 0.5 ? "left" : "right";

      document.getElementById("roundCounter").textContent =
        `Round ${round} of ${TOTAL_ROUNDS}`;

      const left = document.getElementById("cardLeft");
      const right = document.getElementById("cardRight");

      [left, right].forEach(card => {
        card.className = "card";
        card.textContent = "🏠";
      });

      document.getElementById("feedback").textContent = "";
      document.getElementById("feedback").className = "feedback";
      document.getElementById("nextButton").style.display = "none";
    }

    function guess(side) {
      if (answered) return;
      answered = true;

      const left = document.getElementById("cardLeft");
      const right = document.getElementById("cardRight");
      const burningCard = (correctSide === "left") ? right : left; // burning = opposite of "safe"/correct
      const safeCard = (correctSide === "left") ? left : right;

      burningCard.classList.add("burning");
      burningCard.textContent = "🔥";
      safeCard.classList.add("safe");
      safeCard.textContent = "🏠";

      const feedback = document.getElementById("feedback");
      if (side === correctSide) {
        score++;
        feedback.textContent = "Correct!";
        feedback.className = "feedback correct";
      } else {
        feedback.textContent = "Incorrect.";
        feedback.className = "feedback incorrect";
      }

      document.getElementById("nextButton").style.display = "inline-block";
    }

    function showSummary() {
      document.getElementById("screen-game").style.display = "none";
      document.getElementById("screen-summary").style.display = "block";
      document.getElementById("summaryText").textContent =
        `${studentName}, you correctly identified the safe house ${score} out of ${TOTAL_ROUNDS} times.`;
      submitResults();
    }

    function submitResults() {
      const body = new URLSearchParams();
      body.append(NAME_ENTRY_ID, studentName);
      body.append(SCORE_ENTRY_ID, score);

      const fallback = document.getElementById("fallbackLink");
      const manualUrl =
        `https://docs.google.com/forms/d/e/${FORM_ID}/viewform?usp=pp_url` +
        `&${NAME_ENTRY_ID}=${encodeURIComponent(studentName)}` +
        `&${SCORE_ENTRY_ID}=${encodeURIComponent(score)}`;

      // no-cors means we can't read the response, so this always "succeeds"
      // from the browser's point of view — the fallback link stays visible
      // as a just-in-case, not because we detected a failure.
      fetch(FORM_SUBMIT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString()
      }).catch(() => { /* no-cors gives us nothing to act on anyway */ });

      document.getElementById("submitStatus").textContent = "Results submitted — you're all set!";
      fallback.innerHTML = `Didn't see a confirmation from your instructor? <a href="${manualUrl}">Tap here to double-check</a>.`;
    }
  </script>
</body>
</html>
