<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunrise Tacos: Your Bootstrap Sample</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #5f6b76;
      --line: #d5dbe1;
      --blue: #3a75b0;
      --repeat: #f4c95d;
      --repeat-ink: #6b4e00;
      --missing: #eef1f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
      background: #fff;
      line-height: 1.45;
    }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 28px 0 4px; }
    .note { color: var(--muted); font-size: 14px; margin: 0 0 12px; }

    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px 6px; padding-top: 8px; }
    .cell {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 0;
      text-align: center;
      font-size: 17px;
      font-variant-numeric: tabular-nums;
    }
    .cell.repeat { background: var(--repeat); border-color: #e0b13f; color: var(--repeat-ink); font-weight: 600; }
    .cell.missing { background: var(--missing); color: #9aa5b1; }
    .badge {
      position: absolute; top: -8px; right: -6px;
      background: var(--ink); color: #fff;
      font-size: 11px; font-weight: 700;
      border-radius: 10px; padding: 1px 6px;
    }
    .cell.missing .badge { background: #b8c1ca; }

    .mean-box {
      margin: 18px 0 14px;
      padding: 14px 16px;
      border: 2px solid var(--blue);
      border-radius: 8px;
      text-align: center;
    }
    .mean-box .label { font-size: 15px; color: var(--muted); }
    .mean-box .value { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }

    .field { display: block; font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .field input {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 11px 12px;
      font-size: 17px;
      border: 1px solid #b8c1ca;
      border-radius: 6px;
    }
    .field input:focus-visible { outline: 3px solid #1f4f80; outline-offset: 1px; }
    .field input:disabled { background: #f4f6f8; color: var(--muted); }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      background: var(--blue);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { background: #9db6cf; cursor: default; }
    button.secondary { background: #fff; color: var(--blue); border: 2px solid var(--blue); }
    .buttons { display: grid; gap: 10px; }
    button.secondary:disabled { background: #fff; color: #9db6cf; border-color: #c9d6e3; }
    .history { font-size: 15px; margin: 10px 0 0; font-variant-numeric: tabular-nums; }
    .history .sub { font-weight: 700; color: #2e7d32; }
    button:focus-visible { outline: 3px solid #1f4f80; outline-offset: 2px; }
    #status { text-align: center; font-weight: 600; min-height: 1.4em; margin: 10px 0 0; }
    #status.ok { color: #2e7d32; }
    #status.err { color: #c62828; }
  </style>
</head>
<body>
  <main>
    <h1>Your bootstrap sample</h1>
    <p class="note">20 tacos drawn <strong>with replacement</strong> from the original sample of 20.
      The badge shows how many times each taco was picked. Gray tacos weren't picked at all.</p>

    <div id="origGrid" class="grid"></div>

    <div class="mean-box">
      <div class="label">Mean of your bootstrap sample</div>
      <div class="value"><span id="bootMean">—</span> oz</div>
    </div>

    <label class="field">CofC username
      <input id="username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. smithj">
    </label>
    <label class="field">First name and last initial
      <input id="studentName" type="text" autocomplete="off" placeholder="e.g. Jordan S.">
    </label>

    <div class="buttons">
      <button id="submitBtn" type="button">Submit my mean</button>
      <button id="againBtn" type="button" class="secondary" disabled>Get a new sample</button>
    </div>
    <p id="status" role="status"></p>
    <p class="history" id="history"></p>
  </main>

  <script>
    const CONFIG = {
      // From your form's link: https://docs.google.com/forms/d/e/<FORM_ID>/viewform
      FORM_ID: 'PASTE_FORM_ID_HERE',
      // From a prefilled link, e.g. entry.1234567890 (one per Form question)
      ENTRY_ID: 'entry.PASTE_MEAN_ENTRY',
      ENTRY_USERNAME: 'entry.PASTE_USERNAME_ENTRY',
      ENTRY_NAME: 'entry.PASTE_NAME_ENTRY',
      ORIGINAL: [
        8.6, 11.6, 14.9, 10.9, 5.2,
        10.4, 10.7, 14.8, 9.9, 10.6,
        15.3, 9.4, 15.2, 10.4, 12.7,
        12.1, 18.2, 12.2, 11.1, 15.9
      ],
      // Change this (e.g. -v2) to give every device a fresh sample next semester
      STORAGE_KEY: 'sunrise-bootstrap-v1'
    };

    const n = CONFIG.ORIGINAL.length;
    // state: current sample, whether it's been submitted, name fields, and submitted means
    let state = loadState() || { idx: randomIdx(), submitted: false, history: [] };
    if (!Array.isArray(state.history)) state.history = [];
    saveState();

    render();
    document.getElementById('submitBtn').addEventListener('click', submitMean);
    document.getElementById('againBtn').addEventListener('click', newSample);

    function randomIdx() {
      const idx = [];
      for (let i = 0; i < n; i++) idx.push(Math.floor(Math.random() * n));
      return idx;
    }

    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY));
        return s && Array.isArray(s.idx) && s.idx.length === n ? s : null;
      } catch (e) { return null; }
    }

    function saveState() {
      try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function meanOf(idx) {
      return idx.reduce(function(s, i) { return s + CONFIG.ORIGINAL[i]; }, 0) / idx.length;
    }

    function render() {
      const counts = new Array(n).fill(0);
      state.idx.forEach(function(i) { counts[i]++; });

      document.getElementById('origGrid').innerHTML = CONFIG.ORIGINAL.map(function(x, i) {
        return '<div class="cell' + (counts[i] === 0 ? ' missing' : counts[i] > 1 ? ' repeat' : '') + '">' +
               x.toFixed(1) + '<span class="badge">×' + counts[i] + '</span></div>';
      }).join('');

      document.getElementById('bootMean').textContent = meanOf(state.idx).toFixed(2);

      // name fields lock after the first submission so every dot carries the same name
      const u = document.getElementById('username');
      const nm = document.getElementById('studentName');
      if (state.username) { u.value = state.username; u.disabled = true; }
      if (state.name) { nm.value = state.name; nm.disabled = true; }

      // Submit is live until this sample is sent; then only "Get a new sample" is live
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = state.submitted;
      submitBtn.textContent = state.submitted ? 'Mean submitted' : 'Submit my mean';
      document.getElementById('againBtn').disabled = !state.submitted;

      if (state.submitted) setStatus('Submitted! Get a new sample to add another dot.', 'ok');

      document.getElementById('history').innerHTML = state.history.length
        ? 'Your submitted means: ' + state.history.map(function(m) { return m.toFixed(2); }).join(', ')
        : '';
    }

    function newSample() {
      state.idx = randomIdx();
      state.submitted = false;
      saveState();   // saved immediately, so reloading can't skip a sample
      setStatus('');
      render();
    }

    function setStatus(msg, cls) {
      const s = document.getElementById('status');
      s.textContent = msg;
      s.className = cls || '';
    }

    async function submitMean() {
      const btn = document.getElementById('submitBtn');
      const username = document.getElementById('username').value.trim();
      const name = document.getElementById('studentName').value.trim();

      if (!username || !name) {
        setStatus('Enter your username and name first.', 'err');
        return;
      }

      btn.disabled = true;
      setStatus('Submitting…');

      const mean = meanOf(state.idx);
      const body = new URLSearchParams();
      body.append(CONFIG.ENTRY_ID, mean.toFixed(3));
      body.append(CONFIG.ENTRY_USERNAME, username);
      body.append(CONFIG.ENTRY_NAME, name);

      try {
        // no-cors: Google doesn't let us read the reply, but the response is recorded
        await fetch('https://docs.google.com/forms/d/e/' + CONFIG.FORM_ID + '/formResponse', {
          method: 'POST',
          mode: 'no-cors',
          body: body
        });
        state.username = username;
        state.name = name;
        state.submitted = true;
        state.history.push(mean);
        saveState();
        render();
      } catch (e) {
        btn.disabled = false;
        setStatus('Couldn\u2019t submit. Check your connection and tap again.', 'err');
      }
    }
  </script>
</body>
</html>
