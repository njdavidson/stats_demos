<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunrise Tacos: Your Bootstrap Sample</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #5f6b76;
      --line: #d5dbe1;
      --blue: #3a75b0;
      --repeat: #f4c95d;
      --repeat-ink: #6b4e00;
      --missing: #eef1f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
      background: #fff;
      line-height: 1.45;
    }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 28px 0 4px; }
    .note { color: var(--muted); font-size: 14px; margin: 0 0 12px; }

    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .cell {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 0;
      text-align: center;
      font-size: 17px;
      font-variant-numeric: tabular-nums;
    }
    .cell.repeat { background: var(--repeat); border-color: #e0b13f; color: var(--repeat-ink); font-weight: 600; }
    .cell.missing { background: var(--missing); color: #9aa5b1; }
    .badge {
      position: absolute; top: -8px; right: -6px;
      background: var(--ink); color: #fff;
      font-size: 11px; font-weight: 700;
      border-radius: 10px; padding: 1px 6px;
    }
    .cell.missing .badge { background: #b8c1ca; }

    .mean-box {
      margin: 18px 0 14px;
      padding: 14px 16px;
      border: 2px solid var(--blue);
      border-radius: 8px;
      text-align: center;
    }
    .mean-box .label { font-size: 15px; color: var(--muted); }
    .mean-box .value { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }

    .field { display: block; font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .field input {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 11px 12px;
      font-size: 17px;
      border: 1px solid #b8c1ca;
      border-radius: 6px;
    }
    .field input:focus-visible { outline: 3px solid #1f4f80; outline-offset: 1px; }
    .field input:disabled { background: #f4f6f8; color: var(--muted); }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      background: var(--blue);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { background: #9db6cf; cursor: default; }
    button:focus-visible { outline: 3px solid #1f4f80; outline-offset: 2px; }
    #status { text-align: center; font-weight: 600; min-height: 1.4em; margin: 10px 0 0; }
    #status.ok { color: #2e7d32; }
    #status.err { color: #c62828; }
  </style>
</head>
<body>
  <main>
    <h1>Your bootstrap sample</h1>
    <p class="note">20 tacos drawn <strong>with replacement</strong> from the original sample of 20.
      Highlighted values were picked more than once.</p>

    <div id="bootGrid" class="grid"></div>

    <div class="mean-box">
      <div class="label">Mean of your bootstrap sample</div>
      <div class="value"><span id="bootMean">—</span> oz</div>
    </div>

    <label class="field">CofC username
      <input id="username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. smithj">
    </label>
    <label class="field">First name and last initial
      <input id="studentName" type="text" autocomplete="off" placeholder="e.g. Jordan S.">
    </label>

    <button id="submitBtn" type="button">Submit my mean</button>
    <p id="status" role="status"></p>

    <h2>Original sample</h2>
    <p class="note">The badge shows how many times each taco ended up in your bootstrap sample.
      Gray tacos weren't picked at all.</p>
    <div id="origGrid" class="grid"></div>
  </main>

  <script>
    const CONFIG = {
      // From your form's link: https://docs.google.com/forms/d/e/<FORM_ID>/viewform
      FORM_ID: 'PASTE_FORM_ID_HERE',
      // From a prefilled link, e.g. entry.1234567890 (one per Form question)
      ENTRY_ID: 'entry.PASTE_MEAN_ENTRY',
      ENTRY_USERNAME: 'entry.PASTE_USERNAME_ENTRY',
      ENTRY_NAME: 'entry.PASTE_NAME_ENTRY',
      ORIGINAL: [
        8.6, 11.6, 14.9, 10.9, 5.2,
        10.4, 10.7, 14.8, 9.9, 10.6,
        15.3, 9.4, 15.2, 10.4, 12.7,
        12.1, 18.2, 12.2, 11.1, 15.9
      ],
      // Change this (e.g. -v2) to give every device a fresh sample next semester
      STORAGE_KEY: 'sunrise-bootstrap-v1'
    };

    const n = CONFIG.ORIGINAL.length;
    let state = loadState() || newState();
    saveState();

    render();
    document.getElementById('submitBtn').addEventListener('click', submitMean);

    function newState() {
      const idx = [];
      for (let i = 0; i < n; i++) idx.push(Math.floor(Math.random() * n));
      return { idx: idx, submitted: false };
    }

    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY));
        return s && Array.isArray(s.idx) && s.idx.length === n ? s : null;
      } catch (e) { return null; }
    }

    function saveState() {
      try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function bootValues() { return state.idx.map(function(i) { return CONFIG.ORIGINAL[i]; }); }

    function bootMean() {
      const v = bootValues();
      return v.reduce(function(s, x) { return s + x; }, 0) / v.length;
    }

    function render() {
      const counts = new Array(n).fill(0);
      state.idx.forEach(function(i) { counts[i]++; });

      document.getElementById('bootGrid').innerHTML = state.idx.map(function(i) {
        return '<div class="cell' + (counts[i] > 1 ? ' repeat' : '') + '">' +
               CONFIG.ORIGINAL[i].toFixed(1) + '</div>';
      }).join('');

      document.getElementById('origGrid').innerHTML = CONFIG.ORIGINAL.map(function(x, i) {
        return '<div class="cell' + (counts[i] === 0 ? ' missing' : counts[i] > 1 ? ' repeat' : '') + '">' +
               x.toFixed(1) + '<span class="badge">×' + counts[i] + '</span></div>';
      }).join('');

      document.getElementById('bootMean').textContent = bootMean().toFixed(2);

      if (state.submitted) showSubmitted();
    }

    function showSubmitted() {
      const btn = document.getElementById('submitBtn');
      const u = document.getElementById('username');
      const nm = document.getElementById('studentName');
      u.value = state.username || '';
      nm.value = state.name || '';
      u.disabled = true;
      nm.disabled = true;
      btn.disabled = true;
      btn.textContent = 'Mean submitted';
      setStatus('Your mean is in. Watch the board!', 'ok');
    }

    function setStatus(msg, cls) {
      const s = document.getElementById('status');
      s.textContent = msg;
      s.className = cls || '';
    }

    async function submitMean() {
      const btn = document.getElementById('submitBtn');
      const username = document.getElementById('username').value.trim();
      const name = document.getElementById('studentName').value.trim();

      if (!username || !name) {
        setStatus('Enter your username and name first.', 'err');
        return;
      }

      btn.disabled = true;
      setStatus('Submitting…');

      state.username = username;
      state.name = name;

      const body = new URLSearchParams();
      body.append(CONFIG.ENTRY_ID, bootMean().toFixed(3));
      body.append(CONFIG.ENTRY_USERNAME, username);
      body.append(CONFIG.ENTRY_NAME, name);

      try {
        // no-cors: Google doesn't let us read the reply, but the response is recorded
        await fetch('https://docs.google.com/forms/d/e/' + CONFIG.FORM_ID + '/formResponse', {
          method: 'POST',
          mode: 'no-cors',
          body: body
        });
        state.submitted = true;
        saveState();
        showSubmitted();
      } catch (e) {
        btn.disabled = false;
        setStatus('Couldn\u2019t submit. Check your connection and tap again.', 'err');
      }
    }
  </script>
</body>
</html>
